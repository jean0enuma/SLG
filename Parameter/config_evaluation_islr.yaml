dataset: "phoenixT"
work_dir: "/home/caffe/work/SLG/"
device: "cuda:1"
dataset_parameters:
  use_phoenix: False
  use_phoenixT: false
  use_how2sign: False
  use_asl: False
  use_csl: False
  use_csl-daily: False
  use_autsl: True
  is_processed: False
lr_parameters:
  epoch: 40
  learning_rate: 0.0001
  min_lr: 0.000001
