  replacement_num_batches: 100
loss_parameters:
    recon_skeleton: 1.0
    recon_text: 1.0
    kl_skeleton: 0.2
    kl_text: 0.0
    kl_skeleton_aux: 0.0
    kl_text_aux: 0.2
    body_weight: 0.1
    hand_weight: 0.9
    face_weight: 0.2
model:
  pose_dim: 252
  num_classes: 226
  d_model: 512
  nhead: 8
  num_layers: 2


