dataset: "phoenixT"
work_dir: "/home/caffe/work/SLG/"
device: "cuda:0"
dataset_parameters:
  use_phoenix: False
  use_phoenixT: True
  use_how2sign: False
  use_csl-daily: False
  is_processed: True

lr_parameters:
  epoch: 50
  learning_rate : 0.0001
  min_lr: 0
  weight_decay: 0.001
  milestones: [200,320]
  gamma: 0.2
  dropout: 0.3
  amp: True
  display_step: 20
  accumulation_step: 1
  batch_size: 16
  scheduler_timing: "epoch"
  scheduler_type: "CosineAnnealingLR"
  grad_clip_norm: 1.0
  ema: False
  ema_beta: 0.999
loss_parameters:
    pose_loss_weight: 1.0
    stop_loss_weight: 0.0
    bone_loss_weight: 0.0
    velocity_loss_weight: 0.1
    max_length: 300
    pose_weights: 0.1
    hand_weights: 0.9

model:
  pose_dim: 96
  text_encoder_name: "google-bert/bert-base-multilingual-cased"
  text_encoder_requires_grad: True
  text_adapter: False
  hidden_dim: 256
  pose_hidden_dim: 128
  hand_hidden_dim: 256
  extra_hidden_dim: 64
  ffn_mult: 4
  num_heads: 4
  dropout: 0.3
  num_layers: 6
  activation: "gelu"
  trainable: True
