dataset: "phoenixT"
work_dir: "/home/caffe/work/SLG/"
device: "cuda:0"
dataset_parameters:
  use_phoenix: False
  use_phoenixT: False
  use_how2sign: False
  use_asl: False
  use_csl: False
  use_csl-daily: False
  use_autsl: True
  is_processed: False
  is_islr: True
lr_parameters:
  epoch: 100
  learning_rate: 0.0001
  min_lr: 0.000001
  weight_decay: 0.01
  milestones: [50,80]
  dropout: 0.3
  amp: True
  amp_dtype: "bfloat16"
  display_step: 100
  accumulation_step: 1
  batch_size: 32
  scheduler_timing: "step"
  scheduler_type: "CosineAnnealingWarmRestarts"
  grad_clip_norm: 1.0
  ema: False
  ema_beta: 0.999
  replacement_num_batches: 100
loss_parameters:
    recon_skeleton: 1.0
    recon_text: 1.0
    kl_skeleton: 0.2
    kl_text: 0.0
    kl_skeleton_aux: 0.0
    kl_text_aux: 0.2
    body_weight: 0.3
    hand_weight: 0.7
    face_weight: 0.2
model:
  condition_on_text: True
  text_encoder_name: "google-bert/bert-base-multilingual-uncased"
  freeze_text_encoder: True
  skeleton_dim: 100
  skeleton_hand_dim: 21
  skeleton_body_dim: 8
  max_seq_len: 512
  latent_dim: 64
  d_model: 512
  nhead: 8
  num_layers: 2
  dim_feedforward: 2048
  num_timesteps: 1000
  mode: "vae"
  kl_weight: 0.0001
  use_latent_mean: False
  cfg_dropout: 0.1
  guidance_scale: 2.0
  text_encoder_type: "scratch"
  text_num_layers: 2
  text_nhead: 8
  text_dim_feedforward: 2048
  text_pad_token_id: 0
  vae_backbone :  "transformer"



