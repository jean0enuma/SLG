dataset: "phoenixT"
work_dir: "/home/caffe/work/SLG/"
device: "cuda:1"
dataset_parameters:
  use_phoenix: False
  use_phoenixT: True
  use_how2sign: False
  use_csl-daily: False
  is_processed: True
lr_parameters:
  epoch: 20
  learning_rate : 0.0001
  min_lr: 0.000001
  weight_decay: 0.001
  milestones: [50,80]
  dropout: 0.3
  amp: True
  display_step: 100
  accumulation_step: 1
  batch_size: 32
  scheduler_timing: "epoch"
  scheduler_type: "CosineAnnealingLR"
  grad_clip_norm: 1.0
  ema: False
  ema_beta: 0.999
  replacement_num_batches: 100
loss_parameters:
    recon_pos_weight: 1.0
    recon_hand_weight: 1.0
    vq_weight: 1.0

model:
  pose_dim: 100
  in_dim: 100
  hidden_dim: 512
  code_dim: 128
  n_codes: 256
  stride: 4
  n_res_blocks: 4
  dropout: 0.3
  rvq_stages: 1
  vq_beta: 0.5
  n_layers_enc: 1
  n_layers_dec: 1
  n_heads: 8
  ff_mult: 4
  tau: 1.0
  separated_vae:
    pose_d_model: 128
    hand_d_model: 256
    n_pose_heads: 4
    n_hand_heads: 4
    n_pose_layers_enc: 2
    n_hand_layers_enc: 2
    n_pose_layers_dec: 1
    n_hand_layers_dec: 1
    pose_code_dim: 32
    hand_code_dim: 64
    n_pose_codes: 64
    n_hand_codes: 128
tokenizer_parameters:
  k_bodyloc: 32
  k_loc: 64
  k_mov: 64
  k_rel: 32
  k_hs: 128
  hold_speed_thresh: 0.01


